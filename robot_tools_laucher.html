<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Robot Dashboard Launcher</title>
   <style>
       body {
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
           display: flex;
           justify-content: center;
           align-items: center;
           height: 100vh;
           margin: 0;
           background-color: #f5f5f7;
       }
       .container {
           background: white;
           padding: 30px;
           border-radius: 12px;
           box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
           text-align: center;
           max-width: 400px;
           width: 100%;
       }
       h1 {
           font-size: 24px;
           color: #333;
           margin-bottom: 20px;
       }
       input[type="text"] {
           width: 80%;
           padding: 12px;
           font-size: 16px;
           border: 2px solid #ddd;
           border-radius: 6px;
           outline: none;
           text-transform: uppercase;
           margin-bottom: 15px;
           text-align: center;
       }
       input[type="text"]:focus {
           border-color: #0071e3;
       }
       button {
           background-color: #0071e3;
           color: white;
           border: none;
           padding: 12px 24px;
           font-size: 16px;
           border-radius: 6px;
           cursor: pointer;
           font-weight: 600;
           transition: background 0.2s;
       }
       button:hover {
           background-color: #0077ed;
       }
       .note {
           margin-top: 15px;
           font-size: 12px;
           color: #86868b;
       }
   </style>
</head>
<body>


<div class="container">
   <h1>Robot Link Launcher</h1>
   <form id="launcherForm">
       <input type="text" id="robotId" placeholder="Enter Robot ID (e.g., 6E2407)" required autofocus>
       <br>
       <button type="submit">Open All Pages</button>
   </form>
   <div class="note">
       ⚠️ <strong>Note:</strong> You may need to allow <strong>pop-ups</strong> in your browser settings for this page to open multiple tabs at once.
   </div>
</div>


<script>
document.getElementById('launcherForm').addEventListener('submit', function(e) {
   e.preventDefault();
  
   // Get the ID and trim any accidental spaces
   const robotId = document.getElementById('robotId').value.trim();
  
   if (!robotId) return;


   // Define the URLs dynamically based on the ID
   const urls = [
       `https://starship.atlassian.net/issues?jql=textfields%20~%20%22${robotId}%22`,
       `https://chassis-dashboard.tools.starship.xyz/?q=${robotId}&type=bot`,
       `https://tech.starship.xyz/robot/${robotId}`,
       `https://drive.starship.xyz/drive/${robotId}`,
       `https://drive.starship.xyz/calibrate/${robotId}`
   ];


   // Open each URL in a new tab
   urls.forEach(url => {
       window.open(url, '_blank');
   });
});
</script>


</body>
</html>
